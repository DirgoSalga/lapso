services:
  lapso:
    image: nginx:alpine
    container_name: lapso
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.lapso-security-headers.headers.customBrowserXSSValue=0"
      - "traefik.http.middlewares.lapso-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.lapso-security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.lapso-security-headers.headers.frameDeny=false"
      - "traefik.http.middlewares.lapso-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.lapso-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.lapso-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.lapso-security-headers.headers.stsSeconds=3153600"
      - "traefik.http.middlewares.lapso-security-headers.headers.contentSecurityPolicy=default-src 'self'"
      - "traefik.http.middlewares.lapso-security-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.lapso.entrypoints=https"
      - "traefik.http.routers.lapso.rule=Host(`lapso.cloud.dirgosalga.com`)"
      - "traefik.http.routers.lapso.middlewares=lapso-security-headers"
      - "traefik.http.routers.lapso.tls=true"
      - "traefik.http.routers.lapso.tls.certresolver=namecheap"
      - "traefik.http.routers.lapso.tls.domains[0].main=lapso.cloud.dirgosalga.com"
      - "traefik.http.services.lapso.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
