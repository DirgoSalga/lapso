server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker's whole update mechanism depends on the browser
  # re-fetching sw.js on every navigation to byte-compare it; caching it
  # (or the precache manifest it fetches on install) would freeze the app
  # on whatever version installed first.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /sw-assets.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build output (spec: hash router needs no server rewrite rules,
  # and these filenames change whenever their content does), safe to cache
  # for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
